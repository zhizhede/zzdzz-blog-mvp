version: "3.9"

# zzdzz-blog 一键部署
# 使用: cp deploy/.env.example deploy/.env && 编辑 deploy/.env
#       docker compose --env-file deploy/.env -f deploy/docker-compose.yml up -d --build
#
# 或使用 deploy/deploy.sh 自动完成

services:
  postgres:
    image: postgres:16-alpine
    container_name: zzdzz-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB:       ${PG_DB:-zzdzz_blog}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - blog-net

  backend:
    build:
      context: ../
      dockerfile: Dockerfile
    container_name: zzdzz-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # 覆盖 config.yaml 里的字段 (Viper 支持 ZZDZZ_* 环境变量)
      ZZDZZ_DATABASE_HOST:     postgres
      ZZDZZ_DATABASE_PORT:     "5432"
      ZZDZZ_DATABASE_USER:     ${PG_USER:-postgres}
      ZZDZZ_DATABASE_PASSWORD: ${PG_PASSWORD}
      ZZDZZ_DATABASE_DBNAME:   ${PG_DB:-zzdzz_blog}
      ZZDZZ_DATABASE_SSLMODE:  disable
      ZZDZZ_JWT_SECRET:        ${JWT_SECRET}
      ZZDZZ_AI_BASE_URL:       ${AI_BASE_URL}
      ZZDZZ_AI_API_KEY:        ${AI_API_KEY}
      ZZDZZ_AI_MODEL:          ${AI_MODEL:-MiniMax-M3}
      ZZDZZ_AI_ENABLED:        ${AI_ENABLED:-true}
      ZZDZZ_SERVER_MODE:       release
    networks:
      - blog-net

  frontend:
    build:
      context: ../web
      dockerfile: Dockerfile
    container_name: zzdzz-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - backend

networks:
  blog-net:
    driver: bridge

volumes:
  pg_data:
    driver: local